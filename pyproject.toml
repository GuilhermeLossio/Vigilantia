# Tooling configuration only; this is not an installable application package yet.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers"
markers = [
    "unit: isolated tests without network, cloud credentials, or QPU access",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Notebooks add the repository root to sys.path in their first cell, before importing src.
"notebooks/*.ipynb" = ["E402"]
