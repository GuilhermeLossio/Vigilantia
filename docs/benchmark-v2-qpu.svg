<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 810" width="960" height="810" role="img" aria-labelledby="title desc">
<title id="title">Benchmark v2 page kernel on IBM Quantum: accuracy and runtime</title>
<desc id="desc">Run v2page-ibm_fez-20261029T010703Z on 22 internal-test rows: Logistic regression (classical) accuracy 0.955 (95% CI 0.864 to 1.000); RBF SVM (classical) accuracy 0.955 (95% CI 0.864 to 1.000); Random Forest (classical) accuracy 1.000 (95% CI 1.000 to 1.000); Quantum-kernel SVM (exact simulation) accuracy 1.000 (95% CI 1.000 to 1.000), test kernel 43 µs; Quantum-kernel SVM (ibm_fez, uncorrected) accuracy 1.000 (95% CI 1.000 to 1.000), test kernel 153.1 s; Quantum-kernel SVM (ibm_fez, calibrated) accuracy 1.000 (95% CI 1.000 to 1.000). The calibrated hardware kernel reuses the uncorrected jobs.</desc>
<style>
  .surface { fill: var(--surface); }
  .ink { fill: var(--text-primary); }
  .ink2 { fill: var(--text-secondary); }
  .muted { fill: var(--text-muted); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .ref { stroke: var(--text-secondary); stroke-width: 1.5; stroke-dasharray: 4 3; }
  .classical { fill: var(--neutral); }
  .simulation { fill: var(--series-1); }
  .hardware { fill: var(--series-2); }
  .hatch-line { stroke: var(--series-2); stroke-width: 2; }
  .projected { fill: url(#hatch); stroke: var(--series-2); stroke-width: 1.5; }
  text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
  svg {
    --surface: #fcfcfb; --text-primary: #0b0b0b; --text-secondary: #52514e;
    --text-muted: #6f6e69; --grid: #e4e3df; --neutral: #9a9994;
    --series-1: #2a78d6; --series-2: #eb6834;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --surface: #1a1a19; --text-primary: #f0efec; --text-secondary: #c3c2b7;
      --text-muted: #a3a29b; --grid: #383835; --neutral: #7d7c76;
      --series-1: #3987e5; --series-2: #d95926;
    }
  }

  svg { --neutral: #898781; }
  @media (prefers-color-scheme: dark) { svg { --neutral: #7d7c76; } }
  .ring { stroke: var(--surface); stroke-width: 2; }
  .axis { stroke: var(--text-muted); stroke-width: 1; }
  .ci { stroke-width: 2; stroke-linecap: round; fill: none; }
  .ci.classical { stroke: var(--neutral); }
  .ci.simulation { stroke: var(--series-1); }
  .ci.hardware { stroke: var(--series-2); }
  .key { fill: var(--text-secondary); }
</style>
<rect class="surface" width="960" height="810" rx="12"/>
<text class="ink" x="40.0" y="42.0" font-size="22" text-anchor="start" font-weight="600">Benchmark v2: page kernel on IBM Quantum hardware</text>
<text class="ink2" x="40.0" y="64.0" font-size="12" text-anchor="start" font-weight="normal">Run v2page-ibm_fez-20261029T010703Z. 24-example page-feature models; the quantum SVM trains on a simulated kernel and hardware only classifies.</text>
