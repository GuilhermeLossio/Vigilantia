<text class="ink2" x="40.0" y="152.0" font-size="12" text-anchor="start" font-weight="normal">Dot: accuracy. Line: 95% bootstrap interval. Each model uses its frozen v2 threshold; one row moves accuracy by 4.5 points.</text>
