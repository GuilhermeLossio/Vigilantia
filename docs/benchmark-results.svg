<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 786" width="960" height="786" role="img" aria-labelledby="title desc">
<title id="title">Vigilantia benchmark results</title>
<desc id="desc">Bar charts of test accuracy per model, measured kernel error against the exact simulation, and IBM Quantum time used and projected against the Open Plan limit.</desc>
<style>
  .surface { fill: var(--surface); }
  .ink { fill: var(--text-primary); }
  .ink2 { fill: var(--text-secondary); }
  .muted { fill: var(--text-muted); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .ref { stroke: var(--text-secondary); stroke-width: 1.5; stroke-dasharray: 4 3; }
  .classical { fill: var(--neutral); }
  .simulation { fill: var(--series-1); }
  .hardware { fill: var(--series-2); }
  .hatch-line { stroke: var(--series-2); stroke-width: 2; }
  .projected { fill: url(#hatch); stroke: var(--series-2); stroke-width: 1.5; }
  text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
  svg {
    --surface: #fcfcfb; --text-primary: #0b0b0b; --text-secondary: #52514e;
    --text-muted: #6f6e69; --grid: #e4e3df; --neutral: #9a9994;
    --series-1: #2a78d6; --series-2: #eb6834;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --surface: #1a1a19; --text-primary: #f0efec; --text-secondary: #c3c2b7;
      --text-muted: #a3a29b; --grid: #383835; --neutral: #7d7c76;
      --series-1: #3987e5; --series-2: #d95926;
    }
  }
</style>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="6"/></pattern></defs>
<rect class="surface" width="960" height="786" rx="12"/>
<text class="ink" x="40.0" y="42.0" font-size="22" text-anchor="start" font-weight="600">Vigilantia benchmark: phishing URL classification</text>
<text class="ink2" x="40.0" y="64.0" font-size="12" text-anchor="start" font-weight="normal">Classical baselines and a hybrid quantum-kernel SVM (classical training, quantum classification). Exploratory: one split, 24 training / 12 test examples.</text>
<rect class="classical" x="40" y="82" width="14" height="12" rx="2"/>
<text class="ink2" x="60.0" y="92.0" font-size="12" text-anchor="start" font-weight="normal">Classical model</text>
<rect class="simulation" x="175" y="82" width="14" height="12" rx="2"/>
<text class="ink2" x="195.0" y="92.0" font-size="12" text-anchor="start" font-weight="normal">Simulation</text>
<rect class="hardware" x="275" y="82" width="14" height="12" rx="2"/>
<text class="ink2" x="295.0" y="92.0" font-size="12" text-anchor="start" font-weight="normal">IBM Quantum hardware</text>
