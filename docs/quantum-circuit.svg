<text x="1100" y="435" font-size="14" font-weight="bold" text-anchor="middle">M</text>
<rect x="40" y="540" width="550" height="130" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="60" y="571" font-size="16" font-weight="bold" text-anchor="start">Gate definitions</text>
<text x="60" y="599" font-size="14" font-weight="normal" text-anchor="start">Pi = P(2*x[i])</text>
<text x="60" y="626" font-size="14" font-weight="normal" text-anchor="start">Pij = P(2*(pi-x[i])*(pi-x[j]))</text>
<text x="60" y="651" font-size="12" font-weight="normal" text-anchor="start">Each ZZ interaction is CX(i,j), Pij on j, CX(i,j).</text>
<rect x="620" y="540" width="580" height="130" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="640" y="571" font-size="16" font-weight="bold" text-anchor="start">Measured similarity</text>
<text x="640" y="599" font-size="14" font-weight="normal" text-anchor="start">Apply U(x), then inverse U(y), then measure all qubits.</text>
<text x="640" y="626" font-size="14" font-weight="normal" text-anchor="start">K(x,y) = probability of 0000; 1,024 shots per pair.</text>
<text x="640" y="651" font-size="12" font-weight="normal" text-anchor="start">All qubits are logical; physical layout is chosen by transpilation.</text>
<rect x="40" y="710" width="1160" height="50" rx="12" fill="#eff6ff" stroke="#d0d7de"/>
<text x="60" y="740" font-size="14" font-weight="normal" text-anchor="start">Inputs: four training-scaled values in [0, pi]. No trainable ansatz. Hardware results are pending.</text>
