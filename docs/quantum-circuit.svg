<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" role="img" aria-labelledby="title desc">
<title id="title">Vigilantia four-qubit fidelity kernel</title><desc id="desc">Four logical wires show H and feature phase gates followed by linear ZZ interactions on pairs 0-1, 1-2, and 2-3. An inverse U(y) block and measurements estimate the all-zero probability. This is a planned logical circuit, not a transpiled hardware circuit.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/></marker></defs>
